openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: turfs
    description: Discover and manage bookable turfs
  - name: bookings
    description: Booking and availability operations
  - name: reviews
    description: Ratings and owner replies
  - name: dashboard
    description: Marketplace overview metrics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /turfs:
    get:
      operationId: listTurfs
      tags: [turfs]
      summary: List approved turfs
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: location
          in: query
          required: false
          schema: { type: string }
        - name: game
          in: query
          required: false
          schema: { type: string }
        - name: maxPrice
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Turf listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Turf" }
    post:
      operationId: createTurf
      tags: [turfs]
      summary: Submit a turf for admin approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TurfInput" }
      responses:
        "201":
          description: Turf submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turf" }
  /turfs/{turfId}:
    get:
      operationId: getTurf
      tags: [turfs]
      summary: Get a turf detail page
      parameters:
        - $ref: "#/components/parameters/TurfId"
      responses:
        "200":
          description: Turf detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turf" }
        "404":
          description: Turf not found
    patch:
      operationId: updateTurf
      tags: [turfs]
      summary: Update a turf listing
      parameters:
        - $ref: "#/components/parameters/TurfId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TurfUpdate" }
      responses:
        "200":
          description: Updated turf
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turf" }
  /turfs/{turfId}/availability:
    get:
      operationId: getAvailability
      tags: [turfs, bookings]
      summary: Get available flexible-duration slots
      parameters:
        - $ref: "#/components/parameters/TurfId"
        - name: date
          in: query
          required: true
          schema: { type: string }
        - name: game
          in: query
          required: true
          schema: { type: string }
        - name: players
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Availability for the selected date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailabilitySlot" }
  /turfs/{turfId}/blocks:
    post:
      operationId: createTurfBlock
      tags: [turfs, bookings]
      summary: Block time for maintenance or owner use
      parameters:
        - $ref: "#/components/parameters/TurfId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TurfBlockInput" }
      responses:
        "201":
          description: Time block created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurfBlock" }
  /turfs/{turfId}/approval:
    patch:
      operationId: updateTurfApproval
      tags: [turfs]
      summary: Approve or reject a turf
      parameters:
        - $ref: "#/components/parameters/TurfId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TurfApprovalInput" }
      responses:
        "200":
          description: Updated approval status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turf" }
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for the current user
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Booking list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Reserve a turf slot and start payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews for a turf
      parameters:
        - name: turfId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Turf reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
    post:
      operationId: createReview
      tags: [reviews]
      summary: Review a completed booking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
  /reviews/{reviewId}/reply:
    post:
      operationId: replyToReview
      tags: [reviews]
      summary: Reply to a review as the turf owner
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewReplyInput" }
      responses:
        "200":
          description: Review with owner reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get marketplace dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
components:
  parameters:
    TurfId:
      name: turfId
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Turf:
      type: object
      required: [id, name, location, city, description, imageUrl, games, rating, reviewCount, startingPrice, ownerName, approvalStatus]
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        city: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        gallery:
          type: array
          items: { type: string }
        games:
          type: array
          items: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        startingPrice: { type: number }
        ownerName: { type: string }
        approvalStatus:
          type: string
          enum: [pending, approved, rejected]
        amenities:
          type: array
          items: { type: string }
    TurfInput:
      type: object
      required: [name, location, city, description, imageUrl, games, startingPrice]
      properties:
        name: { type: string }
        location: { type: string }
        city: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        games:
          type: array
          items: { type: string }
        startingPrice: { type: number }
    TurfUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string, format: uri }
        games:
          type: array
          items: { type: string }
        startingPrice: { type: number }
    TurfApprovalInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
    AvailabilitySlot:
      type: object
      required: [id, startTime, endTime, price, available, label]
      properties:
        id: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        price: { type: number }
        available: { type: boolean }
        label: { type: string }
        reason:
          type: ["string", "null"]
    TurfBlockInput:
      type: object
      required: [startTime, endTime, reason]
      properties:
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        reason: { type: string, enum: [maintenance, owner_use] }
    TurfBlock:
      allOf:
        - $ref: "#/components/schemas/TurfBlockInput"
        - type: object
          required: [id, turfId]
          properties:
            id: { type: string }
            turfId: { type: string }
    BookingInput:
      type: object
      required: [turfId, game, startTime, endTime, players, amount]
      properties:
        turfId: { type: string }
        game: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        players: { type: integer, minimum: 1 }
        amount: { type: number }
    Booking:
      type: object
      required: [id, turfId, turfName, game, startTime, endTime, players, amount, commission, status, paymentStatus]
      properties:
        id: { type: string }
        turfId: { type: string }
        turfName: { type: string }
        game: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        players: { type: integer }
        amount: { type: number }
        commission: { type: number }
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        paymentStatus:
          type: string
          enum: [pending, paid, refunded]
    ReviewInput:
      type: object
      required: [turfId, bookingId, rating, comment]
      properties:
        turfId: { type: string }
        bookingId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 1 }
    ReviewReplyInput:
      type: object
      required: [reply]
      properties:
        reply: { type: string, minLength: 1 }
    Review:
      type: object
      required: [id, turfId, authorName, rating, comment, createdAt]
      properties:
        id: { type: string }
        turfId: { type: string }
        authorName: { type: string }
        rating: { type: integer }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
        ownerReply:
          type: ["string", "null"]
    DashboardSummary:
      type: object
      required: [approvedTurfs, pendingApprovals, upcomingBookings, grossRevenue, platformCommission]
      properties:
        approvedTurfs: { type: integer }
        pendingApprovals: { type: integer }
        upcomingBookings: { type: integer }
        grossRevenue: { type: number }
        platformCommission: { type: number }

